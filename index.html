<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D FPS Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="settings" class="hidden">
    <div class="settings-card">
      <h2>Settings</h2>
      <label class="toggle-row">
        <span>Auto Shoot</span>
        <input id="autoShoot" type="checkbox">
      </label>
      <p>Automatically fires when an enemy is in the crosshair.</p>
      <button id="closeSettings">Close</button>
    </div>
  </div>

  <div id="hud">
    <div class="top">
      <div>HEALTH <span id="health">100</span></div>
      <div>AMMO <span id="ammo">30</span></div>
      <div>SCORE <span id="score">0</span></div>
    </div>
    <div id="crosshair">+</div>
    <div id="message">Click to play</div>
    <button id="settingsButton">Settings</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
